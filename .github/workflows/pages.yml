name: Deploy PCA explorer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check PCA mathematics
        run: node --test tests/pca-math.test.mjs
      # dist already contains the complete static app; no build is required.
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      # Artifact listing can lag behind a successful upload (actions/deploy-pages#451).
      # Separate jobs and a short buffer reduce that race; this is a workaround.
      - name: Allow artifact listing to update
        run: sleep 10
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
